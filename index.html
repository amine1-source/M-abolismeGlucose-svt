<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratoire ExAO - Métabolisme du Glucose</title>
    <!-- Tailwind CSS pour le design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js pour les graphiques (plus facile à utiliser en Vanilla JS que Recharts) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lien vers notre fichier CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen p-4">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Laboratoire ExAO : Métabolisme du Glucose</h1>
            
            <!-- Sélecteur d'expérience -->
            <div class="grid md:grid-cols-3 gap-3 mb-6">
                <button id="btn-respiration" class="exp-btn active p-3 rounded-xl border-2 transition-all font-bold text-sm">1. Respiration Cellulaire</button>
                <button id="btn-lactique" class="exp-btn inactive p-3 rounded-xl border-2 transition-all font-bold text-sm">2. Fermentation Lactique</button>
                <button id="btn-alcoolique" class="exp-btn inactive p-3 rounded-xl border-2 transition-all font-bold text-sm">3. Fermentation Alcoolique</button>
            </div>

            <div class="grid lg:grid-cols-3 gap-6">
                
                <!-- Graphique ExAO -->
                <div class="lg:col-span-2 bg-slate-900 rounded-2xl p-4 shadow-inner border border-slate-800">
                    <div class="flex justify-between items-center mb-2 px-2 text-slate-300 font-semibold text-sm">
                        <span>Moniteur ExAO</span>
                        <span class="text-emerald-400 font-mono" id="time-display">T = 0.0 min</span>
                    </div>
                    
                    <div class="mx-2 mb-4 p-2 bg-slate-800 border border-slate-700 rounded-lg text-center">
                        <span class="text-xs text-slate-400 uppercase font-bold mr-2">Réaction Globale :</span>
                        <span class="font-mono text-sm text-yellow-400 font-bold" id="reaction-equation">
                            C₆H₁₂O₆ + 6 O₂ ➔ 6 CO₂ + 6 H₂O + Énergie (38 ATP)
                        </span>
                    </div>

                    <div style="height: 450px; width: 100%;">
                        <canvas id="exaoChart"></canvas>
                    </div>
                    
                    <div class="text-center text-xs text-slate-500 italic mt-3 font-medium">
                        * Réalisé par : Pr Amine OUCHKIR | Lycée qualifiant Abou EL Kacim Ezzayani - Khénifra
                    </div>
                </div>

                <!-- Contrôles et Paillasse -->
                <div class="flex flex-col gap-4">
                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                        <div class="flex gap-2 mb-4">
                            <button id="btn-start" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white p-2 rounded font-bold transition-all">Démarrer</button>
                            <button id="btn-pause" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white p-2 rounded font-bold transition-all" disabled>Pause</button>
                            <button id="btn-reset" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 rounded font-bold transition-all">↻</button>
                        </div>
                        <button id="btn-glucose" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 p-2 rounded font-bold border border-blue-200 transition-all opacity-50 cursor-not-allowed" disabled>+ Injecter le Glucose</button>
                    </div>

                    <div class="bg-slate-50 rounded-xl p-4 border border-slate-200 flex-1">
                        <h4 class="font-bold text-slate-700 mb-4 text-center">Observations (Paillasse)</h4>
                        
                        <!-- Zone Paillasse Dynamique -->
                        <div id="paillasse-container" class="space-y-4">
                            <!-- Le contenu sera injecté par Javascript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Lien vers notre fichier JS -->
    <script src="script.js"></script>
</body>
</html>
